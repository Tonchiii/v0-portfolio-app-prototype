name: Security checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pnpm-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        run: npm i -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run pnpm audit (fail on high/critical)
        run: pnpm audit --audit-level=high
